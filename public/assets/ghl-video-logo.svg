<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 100" fill="none" role="img" aria-label="GHL Video">
  <defs>
    <linearGradient id="ghl-text" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1fa84a"/>
      <stop offset="0.55" stop-color="#12a79a"/>
      <stop offset="1" stop-color="#2f79d6"/>
    </linearGradient>
  </defs>
  <!-- pinwheel mark: three rounded blades -->
  <g transform="translate(46,50)">
    <rect x="-9" y="-42" width="18" height="34" rx="9" fill="#2e9bf0"/>
    <rect x="-9" y="-42" width="18" height="34" rx="9" fill="#f4b400" transform="rotate(120)"/>
    <rect x="-9" y="-42" width="18" height="34" rx="9" fill="#22b04b" transform="rotate(240)"/>
  </g>
  <text x="100" y="70" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="56" font-weight="800" letter-spacing="2" fill="url(#ghl-text)">GHL VIDEO</text>
</svg>
